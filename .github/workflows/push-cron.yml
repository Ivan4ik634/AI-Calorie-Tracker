name: Meal reminder push

on:
  schedule:
    # Каждый час (UTC). GitHub Actions бесплатен для публичных репозиториев.
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger push send endpoint
        run: |
          curl -fsS -X GET "${{ secrets.SITE_URL }}/api/push/send" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
